<!DOCTYPE html>
<html lang="ua">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"content=width=device-width, initial-scale=1.0"
  <title></title>
  <link rel="preconnect"
  href="https://fonts.googleapis.com">
  <link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
  <script>
    const card=document.querySelector(".card");
    if(window.matchMedia("(hover:hover)").matches) {
      card.addEventListener("mousemove",(e)=> {
        const rect=card.getBoundingClientRect();
        const x= e.clientX - rect.left;
        const y= e.clientY - rect.top;

        const rotateY = (x/rect.width-0.5)*24;
        const rotateX = (0.5-y/rect.height)*24;

        card.style.transform='perspective(1000px) rotateX(0deg) rotateY(0deg)";
      });
      card.addEventListener(mouseleave",()=>{
        card.style.transform="perspective(1000px) rotateX(0deg) rotateY(0deg)";
      });
    }
  </script>
<body>

<div class="card">
  <div class="profile-header">
  <img src="avatar.png" alt="Аватар">
<h1>Moorevx</h1>
  </div>

  <div class="profile-body">
  <p>Aspiring web-designer</p>
  <button>Связаться</button>
  </div>
</div>

</body>
</html>
